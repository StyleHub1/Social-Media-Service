name: CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: test_user
      DB_PASSWORD: test_pass
      DB_NAME: test_db
      JWT_TOKEN: my_test_jwt_secret
      JWT_EXPIRES_IN: 3600s
      JWT_REFRESH_TOKEN: my_test_refresh_jwt_secret
      JWT_REFRESH_EXPIRES_IN: 7d
      REFRESH_TOKEN_HASH_SECRET: my_test_refresh_token_hash_secret
      JWT_EMAIL_VERIFICATION_SECRET: my_test_email_verification_secret
      JWT_EMAIL_VERIFICATION_EXPIRES_IN: 1d
      RABBITMQ_URL: amqps://wfndvqhu
      RABBITMQ_EXCHANGE: social_media_exchange

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - run: npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: test

    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      APP_NAME: style-hub-social-media-be

    steps:
      - uses: actions/checkout@v4

      - name: Login to Heroku Container Registry
        run: echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com

      - name: Build Docker image
        run: docker build --platform linux/amd64 --provenance=false -t $APP_NAME .

      - name: Push to Heroku Registry
        run: |
          docker tag $APP_NAME registry.heroku.com/$APP_NAME/web
          docker push registry.heroku.com/$APP_NAME/web

      - name: Release on Heroku
        run: |
          echo "Releasing to Heroku..."
          RELEASE_RESPONSE=$(curl -n -X PATCH https://api.heroku.com/apps/$APP_NAME/formation \
            -d '{
              "updates": [
                {
                  "type": "web",
                  "docker_image": "'"$(docker inspect --format='{{.Id}}' registry.heroku.com/$APP_NAME/web)"'"
                }
              ]
            }' \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY")

          echo "Release response: $RELEASE_RESPONSE"

          if echo "$RELEASE_RESPONSE" | grep -q '"id"'; then
            echo "Successfully released to Heroku!"
          else
            echo "Release failed"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi

      - name: Run database migrations
        run: |
          echo "Creating one-off migration dyno..."
          RESPONSE=$(curl -s -X POST "https://api.heroku.com/apps/$APP_NAME/dynos" \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d '{"command":"npm run migration:run:prod","attach":false,"type":"run","time_to_live":300}')

          echo "Dyno response: $RESPONSE"
          DYNO_NAME=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('name',''))" 2>/dev/null || echo "")

          if [ -z "$DYNO_NAME" ]; then
            echo "Failed to create migration dyno"
            exit 1
          fi

          echo "Migration dyno started: $DYNO_NAME"

          for i in $(seq 1 60); do
            sleep 10
            STATE=$(curl -s "https://api.heroku.com/apps/$APP_NAME/dynos/$DYNO_NAME" \
              -H "Accept: application/vnd.heroku+json; version=3" \
              -H "Authorization: Bearer $HEROKU_API_KEY" \
              | python3 -c "import sys,json; print(json.load(sys.stdin).get('state','unknown'))" 2>/dev/null)

            echo "  attempt $i — dyno state: $STATE"

            case "$STATE" in
              complete) echo "Migrations completed successfully"; exit 0 ;;
              crashed|error) echo "Migration dyno failed (state=$STATE)"; exit 1 ;;
            esac
          done

          echo "Timed out waiting for migration dyno to finish"
          exit 1
