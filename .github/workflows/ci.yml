name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1️⃣ Checkout the code
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - run: npm ci

      # 4️⃣ Build NestJS project
      - run: npm run build

      # 5️⃣ Run E2E tests
      - run: npm run test:e2e
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test_user
          DATABASE_PASSWORD: test_pass
          DATABASE_NAME: test_db

      # 6️⃣ Build Docker image (Only for main branch)
      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t stylehub-backend .

      # 7️⃣ Install Heroku CLI (for Docker login and deploy)
      - name: Install Heroku CLI
        if: github.ref == 'refs/heads/main'
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh

      # 8️⃣ Login to Heroku Container Registry
      - name: Login to Heroku
        if: github.ref == 'refs/heads/main'
        run: echo ${{ secrets.HEROKU_API_KEY }} | heroku container:login

      # 9️⃣ Push & Release Docker image to Heroku
      - name: Push & Release Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          heroku container:push web --app style-hub-social-media-be
          heroku container:release web --app style-hub-social-media-be