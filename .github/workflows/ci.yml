name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
          
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: test_user
      DB_PASSWORD: test_pass
      DB_NAME: test_db
      JWT_TOKEN: my_test_jwt_secret
      JWT_EXPIRES_IN: 3600s
      JWT_REFRESH_TOKEN: my_test_refresh_jwt_secret
      JWT_REFRESH_EXPIRES_IN: 7d
      REFRESH_TOKEN_HASH_SECRET: my_test_refresh_token_hash_secret
      JWT_EMAIL_VERIFICATION_SECRET: my_test_email_verification_secret
      JWT_EMAIL_VERIFICATION_EXPIRES_IN: 1d
      E_COMMERCE_SERVICE_URL: https://ecommerce-app-e6303c36e118.herokuapp.com/api/v1
      
    steps:
      # 1️⃣ Checkout the code
      - uses: actions/checkout@v4
      
      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      # 3️⃣ Install dependencies
      - run: npm ci
      
      # 4️⃣ Build NestJS project
      - run: npm run build
      
      # 5️⃣ Run E2E tests
      - run: npm run test:e2e
      
      # 6️⃣ Deploy to Heroku (Only for main branch)
      - name: Deploy to Heroku
        if: github.ref == 'refs/heads/main'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          APP_NAME: style-hub-social-media-be
        run: |
          # Login to Heroku Container Registry
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          
          # Build the Docker image with explicit platform and provenance disabled
          # Added --provenance=false to fix registry error
          docker build --platform linux/amd64 --provenance=false -t $APP_NAME .
          
          # Tag for Heroku registry
          docker tag $APP_NAME registry.heroku.com/$APP_NAME/web
          
          # Push to Heroku registry
          docker push registry.heroku.com/$APP_NAME/web
          
          # Release using curl with proper error handling
          echo "Releasing to Heroku..."
          RELEASE_RESPONSE=$(curl -n -X PATCH https://api.heroku.com/apps/$APP_NAME/formation \
            -d '{
              "updates": [
                {
                  "type": "web",
                  "docker_image": "'"$(docker inspect --format='{{.Id}}' registry.heroku.com/$APP_NAME/web)"'"
                }
              ]
            }' \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY")
          
          echo "Release response: $RELEASE_RESPONSE"
          
          # Check if there's an error in the response
          if echo "$RELEASE_RESPONSE" | grep -q '"id"'; then
            echo "✅ Successfully deployed to Heroku!"
          else
            echo "❌ Deployment failed"
            echo "$RELEASE_RESPONSE"
            exit 1
          fi