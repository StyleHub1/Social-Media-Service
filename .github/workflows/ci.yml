name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user -d test_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      # 1️⃣ Checkout the code
      - uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - run: npm ci

      # 4️⃣ Build NestJS project
      - run: npm run build

      # 5️⃣ Run E2E tests
      - name: Run E2E Tests
        run: npm run test:e2e
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_pass
          DB_NAME: test_db
          JWT_TOKEN: test_jwt_token
          JWT_EXPIRES_IN: 60m
          APP_MESSAGE_PREFIX: "Welcome to the Social Media Service!"

      # 6️⃣ Build Docker image (Only for main branch)
      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t stylehub-backend .

      # 7️⃣ Login to Heroku Container Registry (Only for main branch)
      - name: Login to Heroku Container Registry
        if: github.ref == 'refs/heads/main'
        uses: akshnz/heroku-docker-login@v1
        with:
          email: ${{ secrets.HEROKU_EMAIL }}
          api_key: ${{ secrets.HEROKU_API_KEY }}

      # 8️⃣ Push & Release Docker image to Heroku (Only for main branch)
      - name: Push & Release Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          heroku container:push web --app style-hub-social-media-be
          heroku container:release web --app style-hub-social-media-be