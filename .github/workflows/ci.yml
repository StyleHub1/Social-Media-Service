name: CI/CD Pipeline
on:
  push:
    branches: [ main, dev ]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: test_user
      DB_PASSWORD: test_pass
      DB_NAME: test_db
      JWT_TOKEN: my_test_jwt_secret
      JWT_EXPIRES_IN: 3600s
      
    steps:
      # 1️⃣ Checkout the code
      - uses: actions/checkout@v4
      
      # 2️⃣ Setup Node.js
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      # 3️⃣ Install dependencies
      - run: npm ci
      
      # 4️⃣ Build NestJS project
      - run: npm run build
      
      # 5️⃣ Run E2E tests
      #- run: npm run test:e2e
      
      # 6️⃣ Build Docker image (Only for main branch)
      - name: Build Docker image
        if: github.ref == 'refs/heads/main'
        run: docker build -t stylehub-backend .
      
      # 7️⃣ Deploy to Heroku (Only for main branch)
      - name: Deploy to Heroku
        if: github.ref == 'refs/heads/main'
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          # Login to Heroku Container Registry
          echo "$HEROKU_API_KEY" | docker login --username=_ --password-stdin registry.heroku.com
          
          # Tag and push the image
          docker tag stylehub-backend registry.heroku.com/style-hub-social-media-be/web
          docker push registry.heroku.com/style-hub-social-media-be/web
          
          # Get the Docker image ID
          IMAGE_ID=$(docker inspect registry.heroku.com/style-hub-social-media-be/web:latest --format={{.Id}})
          echo "Deploying image: $IMAGE_ID"
          
          # Release using Heroku Platform API
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PATCH \
            https://api.heroku.com/apps/style-hub-social-media-be/formation \
            -H "Content-Type: application/json" \
            -H "Accept: application/vnd.heroku+json; version=3.docker-releases" \
            -H "Authorization: Bearer $HEROKU_API_KEY" \
            -d "{\"updates\": [{\"type\": \"web\", \"docker_image\": \"$IMAGE_ID\"}]}")
          
          # Extract HTTP status code
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $BODY"
          
          # Check if successful (2xx status code)
          if [[ $HTTP_CODE -ge 200 && $HTTP_CODE -lt 300 ]]; then
            echo "✅ Successfully deployed to Heroku!"
          else
            echo "❌ Failed to deploy to Heroku"
            exit 1
          fi